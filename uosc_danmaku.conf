
# 该选项控制是否开启全自动弹幕填装功能。该功能会在为某个文件夹下的某一集番剧加载过一次弹幕后，把加载过的弹幕会自动关联到该集。之后每次重新播放该文件就会自动加载对应的弹幕，同时该文件对应的文件夹下的所有其他集数的文件都会在播放时自动加载弹幕。
auto_load=yes

# 开关url播放场景自动加载弹幕与关联继承
autoload_for_url=yes

# 开关自动保存弹幕文件（xml格式）至视频同目录
save_danmaku=yes

# 自动加载播放文件同目录下同名的 xml 格式的弹幕文件
autoload_local_danmaku=yes

# 自定义弹幕的透明度，0（完全透明）到1（不透明）。默认值：0.7
opacity=0.5

# 中文简繁转换。0-不转换，1-转换为简体，2-转换为繁体。默认值: 0，不转换简繁字体，按照弹幕源原本字体显示
chConvert=0

# 指定是否使用 fps 视频滤镜 @danmaku:fps=fps=60/1.001，可大幅提升弹幕平滑度。默认禁用
vf_fps=yes

# 指定要使用的 fps 滤镜参数，例如如果设置fps为 60/1.001，则实际生效的视频滤镜参数为 @danmaku:fps=fps=60/1.001
# fps=240

#滚动弹幕的显示时间
scrolltime=15
#固定弹幕的显示时间
fixtime=5
#字体(名称两边不需要使用引号""括住)
fontname=sans-serif
#大小
fontsize=40
#阴影
shadow=0
#粗体
bold=yes
#全部弹幕的显示范围(0.0-1.0)
displayarea=0.6
#描边 0-4
outline=1
#指定弹幕屏蔽词文件路径(black.txt)，支持绝对路径和相对路径。文件内容以换行分隔
##支持 lua 的正则表达式写法
blacklist_path=

# 指定弹幕关联历史记录文件的路径，支持绝对路径和相对路径。默认值是 ~~/danmaku-history.json也就是mpv配置文件夹的根目录下
history_path=~~/cache/danmaku-history.json

# 指定弹幕保存目录。为空时保存到视频同目录
save_danmaku_path=~~/cache/danmaku

# 普通本地视频的保存位置：same_dir / specified_dir；指定目录为空时回退到视频同目录
save_danmaku_local_mode=same_dir

# 自动匹配默认开关；关闭后不自动搜索，但不影响手动搜索
auto_matching=yes

# 弹幕显示开关的初始状态；历史文件中已有 show_danmaku 时以历史状态为准。
show_danmaku_default=yes
